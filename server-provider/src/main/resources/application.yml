spring:
  application:
    name: server-provider
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}

server:
  port: 8080
