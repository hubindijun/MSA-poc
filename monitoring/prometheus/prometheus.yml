global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: msa-poc

scrape_configs:
  - job_name: 'server-provider'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: server-provider

  - job_name: 'server-consumer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: server-consumer
